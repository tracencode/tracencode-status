services:
  status:
    build: .
    restart: unless-stopped
    environment:
      PORT: "8080"
      DATA_DIR: /data
      CHECK_INTERVAL: "60"
    volumes:
      - status-data:/data
      - ./services.json:/app/services.json:ro
    ports:
      - "127.0.0.1:8080:8080"

  caddy:
    image: caddy:2
    profiles: ["edge"]
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - status

volumes:
  status-data:
  caddy-data:
  caddy-config:
